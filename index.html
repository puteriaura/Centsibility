<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/penny-face.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F4FD1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <script>
      (() => {
        const read = key => { try { return localStorage.getItem(key); } catch { return null; } };
        const preference = read("centsibility.appearance");
        const theme = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.dataset.motion = read("centsibility.reduce-animations") === "true" || matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Centsibility | Shariah family finance for kids</title>
    <meta name="description"
        content="Making perfect cents of your family's future. A Shariah kids finance app built on Qard, Hibah, Sadaqah and Zakat." />
    <meta name="author" content="Centsibility" />
    <meta property="og:title" content="Centsibility | Shariah family finance for kids" />
    <meta property="og:description" content="Making perfect cents of your family's future." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@CentsibilityApp" />

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
