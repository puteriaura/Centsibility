<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Centsibility</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/theme-init.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #F5F6FA; color: #161B26; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    [data-theme="dark"] body { background: #0F121A; color: #F2F4F8; }
    main { max-width: 420px; text-align: center; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 14px; background: #DDC518; color: #262101; font-weight: 700; text-decoration: none; border: 1px solid #7D6F09; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That link does not match any Centsibility screen.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
